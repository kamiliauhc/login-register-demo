<!doctype html>
<html lang="Zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录界面</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- 登录卡片 -->
    <div class="card">
      <div class="card_header">
        <h1>登录</h1>
        <p>欢迎回来，继续你的旅程吧</p>
      </div>
      <!-- <h1>登录</h1> -->
      <form action="" id="LoginForm" novalidate>
        <!-- 用户名部分 -->
        <div class="form-group">
          <label for="username">用户名</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="请输入用户名"
          />
        </div>

        <!-- 密码部分 -->
        <div class="form-group">
          <label for="password">密码</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="请输入密码"
          />
        </div>

        <!-- 按钮部分 -->
        <button type="submit" id="SubmitBtn">登录</button>

        <!-- 塞js报告 -->
        <p id="message" class="message"></p>

        <!-- 注册链接 -->
        <p class="link">没有账号？<a href="register.html">去注册</a></p>
      </form>
    </div>

    <script src="js/login.js"></script>
  </body>
</html>
