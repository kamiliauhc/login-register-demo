<!doctype html>
<html lang="Zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>注册</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- 注册卡片 -->
    <div class="card">
      <div class="card_header">
        <h1>创建账号</h1>
        <p>加入我们，开始你的旅程</p>
      </div>
      <form action="" id="RegisterForm" novalidate>
        <!-- 用户名部分 -->
        <div class="form-group">
          <label for="username">用户名</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="3-20位字母、数字或下划线"
          />
        </div>

        <!-- 密码部分 -->
        <div class="form-group">
          <label for="password">密码</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="至少6位密码"
          />
        </div>

        <!-- 确认密码部分 -->
        <div class="form-group">
          <label for="ConfirmPassword">确认密码</label>
          <input
            type="password"
            id="ConfirmPassword"
            name="ConfirmPassword"
            placeholder="再次输入密码"
          />
        </div>

        <!-- 邮箱
        <div class="form-group">
          <label for="email">邮箱</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="请输入邮箱"
            autocomplete="email"
          />
        </div>

         验证码 
        <div class="form-group">
          <input type="text" id="code" name="code" placeholder="请输入验证码" />
          <button type="button" id="sendCode">获取验证码</button>
        </div> -->
        
        <!-- 按钮部分 -->
        <button type="submit" id="SubmitBtn">注册</button>

        <!-- 塞js报告 -->
        <p id="message" class="message"></p>

        <!-- 登录链接 -->
        <p class="link">已有账号？<a href="index.html">去登录</a></p>
      </form>
    </div>

    <script src="js/register.js"></script>
  </body>
</html>
